<VirtualHost *:80>
    DocumentRoot /var/www/html
    AllowEncodedSlashes NoDecode
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        AcceptPathInfo On
    </Directory>
    <Directory /var/www/html/mw-config>
        Require all denied
    </Directory>
    RewriteEngine On
    # ResourceLoader appends its own query string; use a release path, not a
    # query parameter, to invalidate both its startup and stylesheet URLs.
    RewriteRule ^/?load-[0-9a-f]{16}\.php$ %{DOCUMENT_ROOT}/load.php [L]
    # Let MediaWiki parse the original REQUEST_URI. Query rewrites corrupt encoded titles.
    # https://www.mediawiki.org/wiki/Manual:Short_URL/Apache
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/index.php [L]
</VirtualHost>
