<h1 id="keyboard-shortcuts">Keyboard Shortcuts</h1>
<h2 id="search">Search</h2>
<ul>
<li><span class="keys"><kbd class="key-f">F</kbd></span> , <span class="keys"><kbd class="key-s">S</kbd></span> , <span class="keys"><kbd class="key-slash">/</kbd></span> : open search dialog</li>
<li><span class="keys"><kbd class="key-arrow-down">Down</kbd></span> , <span class="keys"><kbd class="key-arrow-up">Up</kbd></span> : select next / previous result</li>
<li><span class="keys"><kbd class="key-arrow-right">Right</kbd></span> : complete search suggestion</li>
<li><span class="keys"><kbd class="key-enter">Enter</kbd></span> : follow selected result</li>
<li><span class="keys"><kbd class="key-escape">Esc</kbd></span> , <span class="keys"><kbd class="key-tab">Tab</kbd></span> : close search dialog</li>
</ul>
