# Publishes the visual guide (wiki-host/docs/visual/) to GitHub Pages.
name: Publish visual guide

on:
  push:
    branches: [wiki]
    paths:
      - wiki-host/docs/visual/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki-host/docs/visual
      - id: deployment
        uses: actions/deploy-pages@v4
